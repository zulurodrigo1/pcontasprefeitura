services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ../api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pcontasprefeitura}
      DB_USERNAME: ${DB_USERNAME:-pcontasprefeitura}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      SESSION_DOMAIN: localhost
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - application

  web:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ../api:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - application

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pcontasprefeitura}
      POSTGRES_USER: ${DB_USERNAME:-pcontasprefeitura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - application

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web
    networks:
      - application

volumes:
  api_vendor:
  frontend_node_modules:
  postgres_data:

networks:
  application:
